name: rehab_flow
description: Rehabilitation Exercise Management Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.8.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.4
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  integration_test:
    sdk: flutter
  network_image_mock: ^2.1.1

# path_provider_foundation 2.6 + objective_c 9.4 crashes on iOS
# (DOBJC_initializeApi / missing native asset). Pin until Flutter ships the fix.
dependency_overrides:
  objective_c: 9.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
